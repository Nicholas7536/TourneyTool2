services:
  - type: web
    name: strikers-tournament-simulator
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run serve
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: strikers
      - key: NODE_VERSION
        value: 22.15.0
